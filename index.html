<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: #333;
      font-size: clamp(1rem, 5vw, 1.8rem);
      padding: 0 16px;
    }

    /* Asegura que el widget del chatbot sea accesible en móvil */
    #cai-webchat {
      position: fixed;
      bottom: 0;
      right: 0;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <h1>Mi Chatbot 🤖</h1>

  <script
    src="https://cdn.cai.tools.sap/webchat/webchat.js"
    channelId="e193ea1b-c839-4fac-843a-fb74f02dc491"
    token="5d751ab7ae05af3285dd75d72febad84"
    id="cai-webchat">
  </script>
</body>
</html>
